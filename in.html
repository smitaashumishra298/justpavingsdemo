<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Get a Quote</title>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
}

/* GET QUOTE BUTTON */
.get-quote-btn{
    background:#C9A227;
    color:#fff;
    border:none;
    padding:14px 28px;
    border-radius:50px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.get-quote-btn:hover{
    background:#a8871c;
    transform:translateY(-2px);
}

/* MODAL */
.quote-modal{
    display:none;
    position:fixed;
    z-index:99999;
    inset:0;
    background:rgba(0,0,0,.65);
    align-items:center;
    justify-content:center;
    padding:20px;
}

.quote-modal.show{
    display:flex;
}

/* MODAL BOX */
.quote-box{
    background:#fff;
    width:100%;
    max-width:600px;
    max-height:90vh;
    overflow-y:auto;
    border-radius:20px;
    padding:35px;
    position:relative;
    box-shadow:0 20px 70px rgba(0,0,0,.3);
}

/* CLOSE */
.quote-close{
    position:absolute;
    top:15px;
    right:18px;
    width:38px;
    height:38px;
    border:none;
    border-radius:50%;
    background:#f1f1f1;
    font-size:24px;
    cursor:pointer;
    color:#333;
}

.quote-close:hover{
    background:#C9A227;
    color:#fff;
}

/* HEADING */
.quote-box h2{
    margin:0 0 8px;
    color:#2F2F2F;
    font-size:32px;
}

.quote-box > p{
    color:#777;
    margin-bottom:25px;
}

/* FORM */
.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-size:14px;
    font-weight:600;
    color:#333;
}

.form-group label span{
    color:#C9A227;
}

.form-control{
    width:100%;
    padding:13px 15px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
    outline:none;
    font-family:Arial,sans-serif;
    background:#fafafa;
}

.form-control:focus{
    border-color:#C9A227;
    background:#fff;
    box-shadow:0 0 0 3px rgba(201,162,39,.12);
}

.form-control.invalid{
    border-color:#dc3545;
}

.form-control.valid{
    border-color:#198754;
}

.field-error{
    color:#dc3545;
    font-size:12px;
    margin-top:5px;
    display:none;
}

.field-error.show{
    display:block;
}

/* SUBMIT */
.submit-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:50px;
    background:#C9A227;
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.submit-btn:hover{
    background:#a8871c;
}

.submit-btn:disabled{
    opacity:.7;
    cursor:not-allowed;
}

/* MESSAGE */
.quote-message{
    display:none;
    padding:13px 15px;
    border-radius:10px;
    margin-bottom:18px;
    font-size:14px;
}

.quote-message.show{
    display:block;
}

.quote-message.success{
    background:#eaf7ee;
    color:#1e7a3c;
    border:1px solid #bfe6c9;
}

.quote-message.error{
    background:#fdeceb;
    color:#b02a26;
    border:1px solid #f4c7c4;
}

/* MOBILE */
@media(max-width:600px){

    .quote-box{
        padding:25px 20px;
        border-radius:16px;
    }

    .quote-box h2{
        font-size:26px;
    }

    .get-quote-btn{
        width:100%;
    }
}
</style>
</head>

<body>


<!-- =========================================================
     GET QUOTE BUTTON
========================================================= -->

<button type="button" class="get-quote-btn" id="openQuote">
    Get Quote
</button>


<!-- =========================================================
     QUOTE MODAL
========================================================= -->

<div class="quote-modal" id="quoteModal">

    <div class="quote-box">

        <button type="button" class="quote-close" id="closeQuote">
            &times;
        </button>

        <h2>Get a Quote</h2>

        <p>
            Fill in your details and we will get back to you shortly.
        </p>


        <!-- MESSAGE -->
        <div id="quoteMessage" class="quote-message"></div>


        <!-- FORM -->
        <form id="quoteForm" novalidate>


            <!-- FULL NAME -->
            <div class="form-group">

                <label>
                    Full Name <span>*</span>
                </label>

                <input
                    type="text"
                    id="fullName"
                    name="full_name"
                    class="form-control"
                    placeholder="Enter your full name"
                >

                <div class="field-error" id="fullNameError"></div>

            </div>


            <!-- COMPANY -->
            <div class="form-group">

                <label>
                    Company Name <span>*</span>
                </label>

                <input
                    type="text"
                    id="companyName"
                    name="company_name"
                    class="form-control"
                    placeholder="Enter company name"
                >

                <div class="field-error" id="companyNameError"></div>

            </div>


            <!-- ADDRESS -->
            <div class="form-group">

                <label>
                    Address <span>*</span>
                </label>

                <textarea
                    id="address"
                    name="address"
                    class="form-control"
                    rows="3"
                    placeholder="Enter your address"
                ></textarea>

                <div class="field-error" id="addressError"></div>

            </div>


            <!-- PHONE -->
            <div class="form-group">

                <label>
                    Phone Number <span>*</span>
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    class="form-control"
                    placeholder="Enter phone number"
                    maxlength="15"
                >

                <div class="field-error" id="phoneError"></div>

            </div>


            <!-- MESSAGE -->
            <div class="form-group">

                <label>
                    Your Message <span>*</span>
                </label>

                <textarea
                    id="yourMessage"
                    name="message"
                    class="form-control"
                    rows="4"
                    placeholder="Tell us what you need..."
                ></textarea>

                <div class="field-error" id="yourMessageError"></div>

            </div>


            <!-- SUBMIT -->
            <button
                type="submit"
                class="submit-btn"
                id="quoteSubmit"
            >

                <span id="submitText">
                    Send Quote Request
                </span>

                <span id="submitLoading" style="display:none;">
                    Sending...
                </span>

            </button>

        </form>

    </div>

</div>


<script>

/* ============================================================
   EMAILJS CONFIGURATION
   ONLY CHANGE THESE 3 VALUES
============================================================ */

const EMAILJS_PUBLIC_KEY = "YOUR_PUBLIC_KEY";

const EMAILJS_SERVICE_ID = "YOUR_SERVICE_ID";

const EMAILJS_TEMPLATE_ID = "YOUR_TEMPLATE_ID";


/* ============================================================
   INITIALIZE EMAILJS
============================================================ */

emailjs.init({
    publicKey: EMAILJS_PUBLIC_KEY
});


/* ============================================================
   ELEMENTS
============================================================ */

const openQuote =
    document.getElementById("openQuote");

const closeQuote =
    document.getElementById("closeQuote");

const quoteModal =
    document.getElementById("quoteModal");

const quoteForm =
    document.getElementById("quoteForm");

const quoteMessage =
    document.getElementById("quoteMessage");

const submitButton =
    document.getElementById("quoteSubmit");

const submitText =
    document.getElementById("submitText");

const submitLoading =
    document.getElementById("submitLoading");


const fullName =
    document.getElementById("fullName");

const companyName =
    document.getElementById("companyName");

const address =
    document.getElementById("address");

const phone =
    document.getElementById("phone");

const yourMessage =
    document.getElementById("yourMessage");


/* ============================================================
   OPEN MODAL
============================================================ */

openQuote.addEventListener("click", function(){

    quoteModal.classList.add("show");

});


/* ============================================================
   CLOSE MODAL
============================================================ */

closeQuote.addEventListener("click", function(){

    quoteModal.classList.remove("show");

});


/* ============================================================
   CLOSE WHEN CLICK OUTSIDE
============================================================ */

quoteModal.addEventListener("click", function(event){

    if(event.target === quoteModal){

        quoteModal.classList.remove("show");

    }

});


/* ============================================================
   ESC KEY
============================================================ */

document.addEventListener("keydown", function(event){

    if(event.key === "Escape"){

        quoteModal.classList.remove("show");

    }

});


/* ============================================================
   ERROR FUNCTION
============================================================ */

function showError(input, errorElement, message){

    input.classList.add("invalid");

    input.classList.remove("valid");

    errorElement.textContent = message;

    errorElement.classList.add("show");

}


/* ============================================================
   CLEAR ERROR
============================================================ */

function clearError(input, errorElement){

    input.classList.remove("invalid");

    errorElement.textContent = "";

    errorElement.classList.remove("show");

}


/* ============================================================
   VALIDATE TEXT
============================================================ */

function validateText(input, errorElement, message){

    if(input.value.trim() === ""){

        showError(
            input,
            errorElement,
            message
        );

        return false;
    }

    clearError(
        input,
        errorElement
    );

    input.classList.add("valid");

    return true;

}


/* ============================================================
   PHONE VALIDATION
============================================================ */

function validatePhone(){

    const value =
        phone.value.trim();

    const phonePattern =
        /^[0-9+\-\s()]{7,15}$/;


    if(value === ""){

        showError(
            phone,
            document.getElementById("phoneError"),
            "Please enter your phone number."
        );

        return false;

    }


    if(!phonePattern.test(value)){

        showError(
            phone,
            document.getElementById("phoneError"),
            "Please enter a valid phone number."
        );

        return false;

    }


    clearError(
        phone,
        document.getElementById("phoneError")
    );

    phone.classList.add("valid");

    return true;

}


/* ============================================================
   CLEAR SUCCESS / ERROR MESSAGE
============================================================ */

function clearMessage(){

    quoteMessage.className =
        "quote-message";

    quoteMessage.innerHTML = "";

}


/* ============================================================
   FORM SUBMIT
============================================================ */

quoteForm.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        clearMessage();


        /* VALIDATION */

        const validName =
            validateText(
                fullName,
                document.getElementById("fullNameError"),
                "Please enter your full name."
            );


        const validCompany =
            validateText(
                companyName,
                document.getElementById("companyNameError"),
                "Please enter your company name."
            );


        const validAddress =
            validateText(
                address,
                document.getElementById("addressError"),
                "Please enter your address."
            );


        const validPhone =
            validatePhone();


        const validMessage =
            validateText(
                yourMessage,
                document.getElementById("yourMessageError"),
                "Please enter your message."
            );


        /* STOP */

        if(
            !validName ||
            !validCompany ||
            !validAddress ||
            !validPhone ||
            !validMessage
        ){

            return;

        }


        /* LOADING */

        submitButton.disabled = true;

        submitText.style.display = "none";

        submitLoading.style.display = "inline";


        /* ====================================================
           EMAILJS SEND
        ==================================================== */

        const templateParams = {

            full_name:
                fullName.value.trim(),

            company_name:
                companyName.value.trim(),

            address:
                address.value.trim(),

            phone:
                phone.value.trim(),

            message:
                yourMessage.value.trim()

        };


        emailjs.send(
            EMAILJS_SERVICE_ID,
            EMAILJS_TEMPLATE_ID,
            templateParams
        )


        /* ====================================================
           SUCCESS
        ==================================================== */

        .then(function(response){

            console.log(
                "Email sent successfully:",
                response
            );


            quoteMessage.className =
                "quote-message success show";

            quoteMessage.innerHTML =
                "✓ Thank you! Your quote request has been sent successfully.";


            /* RESET FORM */

            quoteForm.reset();


            document
                .querySelectorAll(".form-control")
                .forEach(function(input){

                    input.classList.remove(
                        "valid",
                        "invalid"
                    );

                });


            document
                .querySelectorAll(".field-error")
                .forEach(function(error){

                    error.classList.remove("show");

                    error.textContent = "";

                });


        })


        /* ====================================================
           ERROR
        ==================================================== */

        .catch(function(error){

            console.error(
                "EmailJS Error:",
                error
            );


            quoteMessage.className =
                "quote-message error show";

            quoteMessage.innerHTML =
                "✕ Unable to send your request. Please try again later.";

        })


        /* ====================================================
           RESET BUTTON
        ==================================================== */

        .finally(function(){

            submitButton.disabled = false;

            submitText.style.display = "inline";

            submitLoading.style.display = "none";

        });

    }
);


/* ============================================================
   LIVE VALIDATION
============================================================ */

fullName.addEventListener(
    "input",
    function(){

        if(this.value.trim() !== ""){

            clearError(
                this,
                document.getElementById("fullNameError")
            );

        }

    }
);


companyName.addEventListener(
    "input",
    function(){

        if(this.value.trim() !== ""){

            clearError(
                this,
                document.getElementById("companyNameError")
            );

        }

    }
);


address.addEventListener(
    "input",
    function(){

        if(this.value.trim() !== ""){

            clearError(
                this,
                document.getElementById("addressError")
            );

        }

    }
);


yourMessage.addEventListener(
    "input",
    function(){

        if(this.value.trim() !== ""){

            clearError(
                this,
                document.getElementById("yourMessageError")
            );

        }

    }
);


/* ============================================================
   PHONE ONLY NUMBERS + ALLOWED CHARACTERS
============================================================ */

phone.addEventListener(
    "input",
    function(){

        this.value =
            this.value.replace(
                /[^0-9+\-\s()]/g,
                ""
            );


        if(this.value.trim() !== ""){

            clearError(
                this,
                document.getElementById("phoneError")
            );

        }

    }
);

</script>

</body>
</html>
