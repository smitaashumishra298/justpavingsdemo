<!-- ================= GET QUOTE BUTTON ================= -->

<button type="button" class="quote-btn" id="openQuote">
    Get Quote
</button>


<!-- ================= QUOTE MODAL ================= -->

<div class="quote-modal" id="quoteModal" aria-hidden="true">

    <div class="quote-overlay" id="quoteOverlay"></div>

    <div class="quote-dialog">

        <button type="button"
                class="quote-close"
                id="closeQuote"
                aria-label="Close">
            &times;
        </button>

        <div class="quote-header">
            <span>GET A QUOTE</span>
            <h2>Let's Discuss Your Project</h2>
            <p>
                Fill in your details and we will get back to you.
            </p>
        </div>


        <!-- SUCCESS MESSAGE -->

        <div class="quote-success" id="quoteSuccess">
            <div class="success-icon">✓</div>

            <h3>Thank You!</h3>

            <p>
                Your quote request has been submitted successfully.
            </p>
        </div>


        <!-- FORM -->

        <form id="quoteForm" novalidate>

            <!-- Full Name -->

            <div class="quote-field">

                <label for="fullName">
                    Full Name <span>*</span>
                </label>

                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    placeholder="Enter your full name"
                    autocomplete="name"
                >

                <small class="field-error"></small>

            </div>


            <!-- Company -->

            <div class="quote-field">

                <label for="companyName">
                    Company Name <span>*</span>
                </label>

                <input
                    type="text"
                    id="companyName"
                    name="companyName"
                    placeholder="Enter company name"
                    autocomplete="organization"
                >

                <small class="field-error"></small>

            </div>


            <!-- Address -->

            <div class="quote-field">

                <label for="address">
                    Address <span>*</span>
                </label>

                <textarea
                    id="address"
                    name="address"
                    rows="3"
                    placeholder="Enter your address"
                ></textarea>

                <small class="field-error"></small>

            </div>


            <!-- Phone -->

            <div class="quote-field">

                <label for="phone">
                    Phone Number <span>*</span>
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter phone number"
                    autocomplete="tel"
                    inputmode="tel"
                >

                <small class="field-error"></small>

            </div>


            <!-- Message -->

            <div class="quote-field">

                <label for="yourMessage">
                    Your Message <span>*</span>
                </label>

                <textarea
                    id="yourMessage"
                    name="yourMessage"
                    rows="4"
                    placeholder="Tell us about your project..."
                ></textarea>

                <small class="field-error"></small>

            </div>


            <!-- GENERAL ERROR -->

            <div class="form-error" id="formError"></div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="quote-submit"
                id="quoteSubmit"
            >

                <span id="submitText">
                    Send Quote Request
                </span>

                <span id="submitLoading">
                    Sending...
                </span>

            </button>

        </form>

    </div>

</div>
