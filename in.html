<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JustPaving — Get a Quote</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Your CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<style>/* ============================================================
   GET QUOTE BUTTON
============================================================ */

.get-quote-btn {
    background: #C9A227;
    color: #1d1d1d;
    border: none;
    padding: 15px 28px;
    border-radius: 50px;
    font-weight: 600;
    font-size: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all .35s ease;
}

.get-quote-btn:hover {
    background: #a8871c;
    color: #fff;
    transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(201, 162, 39, .30);
}

.get-quote-btn i {
    transition: transform .3s ease;
}

.get-quote-btn:hover i {
    transform: translateX(5px);
}


/* ============================================================
   QUOTE MODAL
============================================================ */

.quote-modal {
    border: none;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .25);
}


/* Modal Header */

.quote-modal-header {
    background: #2F2F2F;
    color: #fff;
    padding: 28px 32px;
    border: none;
}

.quote-modal-header h2 {
    color: #fff;
    margin: 6px 0 0;
    font-size: 30px;
    font-family: Georgia, serif;
    font-weight: 600;
}

.quote-eyebrow {
    color: #C9A227;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
}


/* Close Button */

.quote-modal-header .btn-close {
    filter: brightness(0) invert(1);
    opacity: .8;
}

.quote-modal-header .btn-close:hover {
    opacity: 1;
}


/* Modal Body */

.quote-modal .modal-body {
    padding: 32px;
    background: #fff;
}


/* Form Group */

.form-group-custom {
    margin-bottom: 20px;
}

.form-group-custom label {
    display: block;
    color: #2F2F2F;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 7px;
}

.form-group-custom label span {
    color: #C9A227;
}


/* Inputs */

.form-group-custom .form-control {
    border: 1.5px solid #e8e6e1;
    border-radius: 12px;
    padding: 13px 15px;
    font-size: 15px;
    color: #333;
    background: #fbfbfa;
    box-shadow: none;
    transition:
        border-color .3s ease,
        box-shadow .3s ease,
        background .3s ease;
}

.form-group-custom .form-control:focus {
    border-color: #C9A227;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(201, 162, 39, .13);
}


/* Placeholder */

.form-group-custom .form-control::placeholder {
    color: #999;
}


/* Invalid */

.form-group-custom .form-control.is-invalid {
    border-color: #dc3545;
    background: #fff8f8;
    box-shadow: none;
}


/* Valid */

.form-group-custom .form-control.is-valid {
    border-color: #198754;
    background: #f8fff9;
    box-shadow: none;
}


/* Error */

.field-error {
    display: none;
    color: #dc3545;
    font-size: 12px;
    margin-top: 5px;
}

.field-error.show {
    display: block;
}


/* ============================================================
   SUBMIT BUTTON
============================================================ */

.quote-submit-btn {
    width: 100%;
    background: #C9A227;
    color: #1d1d1d;
    border: none;
    border-radius: 50px;
    padding: 15px 24px;
    font-size: 15px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all .35s ease;
}

.quote-submit-btn:hover {
    background: #a8871c;
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(201, 162, 39, .3);
}

.quote-submit-btn:disabled {
    opacity: .7;
    cursor: not-allowed;
    transform: none;
}


/* Loading */

.submit-loading {
    display: none;
}


/* ============================================================
   SUCCESS / ERROR MESSAGE
============================================================ */

.quote-message {
    display: none;
    padding: 14px 16px;
    border-radius: 12px;
    margin-bottom: 22px;
    font-size: 14px;
    font-weight: 500;
}

.quote-message.show {
    display: flex;
    align-items: center;
    gap: 10px;
}

.quote-message.success {
    background: #eaf7ee;
    border: 1px solid #bfe6c9;
    color: #1e7a3c;
}

.quote-message.error {
    background: #fdeceb;
    border: 1px solid #f4c7c4;
    color: #b02a26;
}


/* ============================================================
   MOBILE
============================================================ */

@media (max-width: 576px) {

    .quote-modal-header {
        padding: 22px 20px;
    }

    .quote-modal-header h2 {
        font-size: 25px;
    }

    .quote-modal .modal-body {
        padding: 22px 20px;
    }

    .form-group-custom {
        margin-bottom: 17px;
    }

    .form-group-custom .form-control {
        font-size: 16px;
    }

    .get-quote-btn {
        width: 100%;
    }

}</style>
<body>

    <!-- =========================
         GET QUOTE BUTTON
    ========================== -->
    <div class="container py-5 text-center">

        <button
            type="button"
            class="btn btn-gold get-quote-btn"
            data-bs-toggle="modal"
            data-bs-target="#quoteModal"
        >
            Get a Quote
            <i class="fa-solid fa-arrow-right"></i>
        </button>

    </div>


    <!-- =========================
         QUOTE MODAL
    ========================== -->
    <div
        class="modal fade"
        id="quoteModal"
        tabindex="-1"
        aria-labelledby="quoteModalLabel"
        aria-hidden="true"
    >

        <div class="modal-dialog modal-dialog-centered modal-lg">

            <div class="modal-content quote-modal">

                <!-- Modal Header -->
                <div class="modal-header quote-modal-header">

                    <div>
                        <span class="quote-eyebrow">
                            GET IN TOUCH
                        </span>

                        <h2 id="quoteModalLabel">
                            Request a Quote
                        </h2>
                    </div>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                    ></button>

                </div>


                <!-- Modal Body -->
                <div class="modal-body">

                    <!-- Success / Error Message -->
                    <div
                        id="quoteMessage"
                        class="quote-message"
                        role="alert"
                    ></div>


                    <!-- Quote Form -->
                    <form
                        id="quoteForm"
                        action="ct.php"
                        method="POST"
                        novalidate
                    >

                        <!-- Full Name -->
                        <div class="form-group-custom">

                            <label for="fullName">
                                Full Name <span>*</span>
                            </label>

                            <input
                                type="text"
                                id="fullName"
                                name="full_name"
                                class="form-control"
                                placeholder="Enter your full name"
                                autocomplete="name"
                            >

                            <div class="field-error"></div>

                        </div>


                        <!-- Company Name -->
                        <div class="form-group-custom">

                            <label for="companyName">
                                Company Name <span>*</span>
                            </label>

                            <input
                                type="text"
                                id="companyName"
                                name="company_name"
                                class="form-control"
                                placeholder="Enter company name"
                                autocomplete="organization"
                            >

                            <div class="field-error"></div>

                        </div>


                        <!-- Address -->
                        <div class="form-group-custom">

                            <label for="address">
                                Address <span>*</span>
                            </label>

                            <textarea
                                id="address"
                                name="address"
                                class="form-control"
                                rows="3"
                                placeholder="Enter your address"
                            ></textarea>

                            <div class="field-error"></div>

                        </div>


                        <!-- Phone -->
                        <div class="form-group-custom">

                            <label for="phone">
                                Phone Number <span>*</span>
                            </label>

                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                class="form-control"
                                placeholder="Enter phone number"
                                autocomplete="tel"
                                maxlength="15"
                            >

                            <div class="field-error"></div>

                        </div>


                        <!-- Message -->
                        <div class="form-group-custom">

                            <label for="yourMessage">
                                Your Message <span>*</span>
                            </label>

                            <textarea
                                id="yourMessage"
                                name="message"
                                class="form-control"
                                rows="5"
                                placeholder="Tell us about your project..."
                            ></textarea>

                            <div class="field-error"></div>

                        </div>


                        <!-- Submit -->
                        <button
                            type="submit"
                            id="quoteSubmit"
                            class="btn quote-submit-btn"
                        >

                            <span class="submit-text">
                                Send Quote Request
                            </span>

                            <span class="submit-loading">
                                <i class="fa-solid fa-spinner fa-spin"></i>
                                Sending...
                            </span>

                            <i class="fa-solid fa-paper-plane send-icon"></i>

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- Your JavaScript -->
    <script src="script.js"></script>

</body>
<script>document.addEventListener("DOMContentLoaded", function () {

    const form = document.getElementById("quoteForm");
    const messageBox = document.getElementById("quoteMessage");
    const submitButton = document.getElementById("quoteSubmit");

    if (!form) {
        return;
    }


    /* ============================================================
       INPUT ELEMENTS
    ============================================================ */

    const fullName = document.getElementById("fullName");
    const companyName = document.getElementById("companyName");
    const address = document.getElementById("address");
    const phone = document.getElementById("phone");
    const yourMessage = document.getElementById("yourMessage");


    /* ============================================================
       SHOW ERROR
    ============================================================ */

    function showError(input, message) {

        input.classList.add("is-invalid");
        input.classList.remove("is-valid");

        const errorBox =
            input.parentElement.querySelector(".field-error");

        if (errorBox) {
            errorBox.textContent = message;
            errorBox.classList.add("show");
        }
    }


    /* ============================================================
       CLEAR ERROR
    ============================================================ */

    function clearError(input) {

        input.classList.remove("is-invalid");

        const errorBox =
            input.parentElement.querySelector(".field-error");

        if (errorBox) {
            errorBox.textContent = "";
            errorBox.classList.remove("show");
        }
    }


    /* ============================================================
       VALIDATE FIELD
    ============================================================ */

    function validateField(input, message) {

        const value = input.value.trim();

        if (value === "") {

            showError(input, message);

            return false;
        }

        clearError(input);
        input.classList.add("is-valid");

        return true;
    }


    /* ============================================================
       PHONE VALIDATION
    ============================================================ */

    function validatePhone() {

        const value = phone.value.trim();

        const phonePattern = /^[0-9+\-\s()]{7,15}$/;

        if (value === "") {

            showError(
                phone,
                "Please enter your phone number."
            );

            return false;
        }

        if (!phonePattern.test(value)) {

            showError(
                phone,
                "Please enter a valid phone number."
            );

            return false;
        }

        clearError(phone);
        phone.classList.add("is-valid");

        return true;
    }


    /* ============================================================
       CLEAR MESSAGE
    ============================================================ */

    function clearMessage() {

        messageBox.className = "quote-message";
        messageBox.innerHTML = "";

    }


    /* ============================================================
       FORM SUBMIT
    ============================================================ */

    form.addEventListener("submit", async function (event) {

        event.preventDefault();

        clearMessage();


        /* -----------------------------------------
           VALIDATE ALL FIELDS
        ----------------------------------------- */

        const validName = validateField(
            fullName,
            "Please enter your full name."
        );

        const validCompany = validateField(
            companyName,
            "Please enter your company name."
        );

        const validAddress = validateField(
            address,
            "Please enter your address."
        );

        const validPhone = validatePhone();

        const validMessage = validateField(
            yourMessage,
            "Please enter your message."
        );


        /* -----------------------------------------
           STOP IF VALIDATION FAILS
        ----------------------------------------- */

        if (
            !validName ||
            !validCompany ||
            !validAddress ||
            !validPhone ||
            !validMessage
        ) {

            return;
        }


        /* -----------------------------------------
           LOADING STATE
        ----------------------------------------- */

        submitButton.disabled = true;

        submitButton.querySelector(".submit-text").style.display = "none";

        submitButton.querySelector(".submit-loading").style.display = "inline";

        submitButton.querySelector(".send-icon").style.display = "none";


        /* -----------------------------------------
           FORM DATA
        ----------------------------------------- */

        const formData = new FormData(form);


        /* -----------------------------------------
           AJAX REQUEST
        ----------------------------------------- */

        try {

            const response = await fetch("ct.php", {
                method: "POST",
                body: formData
            });


            const result = await response.json();


            /* -----------------------------------------
               SUCCESS
            ----------------------------------------- */

            if (result.success) {

                messageBox.className =
                    "quote-message success show";

                messageBox.innerHTML =
                    '<i class="fa-solid fa-circle-check"></i>' +
                    '<span>' +
                    result.message +
                    '</span>';


                /* Clear form */

                form.reset();


                /* Remove validation classes */

                const inputs =
                    form.querySelectorAll(".form-control");

                inputs.forEach(function (input) {

                    input.classList.remove("is-valid");
                    input.classList.remove("is-invalid");

                });


                /* Hide errors */

                const errors =
                    form.querySelectorAll(".field-error");

                errors.forEach(function (error) {

                    error.classList.remove("show");
                    error.textContent = "";

                });


            } else {

                messageBox.className =
                    "quote-message error show";

                messageBox.innerHTML =
                    '<i class="fa-solid fa-circle-exclamation"></i>' +
                    '<span>' +
                    (result.message ||
                        "Something went wrong. Please try again.") +
                    '</span>';

            }


        } catch (error) {

            console.error("AJAX Error:", error);

            messageBox.className =
                "quote-message error show";

            messageBox.innerHTML =
                '<i class="fa-solid fa-circle-exclamation"></i>' +
                '<span>' +
                'Unable to send your request. Please try again later.' +
                '</span>';

        }


        /* -----------------------------------------
           RESET BUTTON
        ----------------------------------------- */

        submitButton.disabled = false;

        submitButton.querySelector(".submit-text").style.display = "inline";

        submitButton.querySelector(".submit-loading").style.display = "none";

        submitButton.querySelector(".send-icon").style.display = "inline";


    });


    /* ============================================================
       LIVE VALIDATION
    ============================================================ */

    fullName.addEventListener("input", function () {

        if (this.value.trim() !== "") {
            clearError(this);
        }

    });


    companyName.addEventListener("input", function () {

        if (this.value.trim() !== "") {
            clearError(this);
        }

    });


    address.addEventListener("input", function () {

        if (this.value.trim() !== "") {
            clearError(this);
        }

    });


    yourMessage.addEventListener("input", function () {

        if (this.value.trim() !== "") {
            clearError(this);
        }

    });


    phone.addEventListener("input", function () {

        this.value = this.value.replace(
            /[^0-9+\-\s()]/g,
            ""
        );

        if (this.value.trim() !== "") {
            clearError(this);
        }

    });


    /* ============================================================
       WHEN MODAL OPENS
    ============================================================ */

    const quoteModal =
        document.getElementById("quoteModal");

    if (quoteModal) {

        quoteModal.addEventListener(
            "show.bs.modal",
            function () {

                clearMessage();

            }
        );

    }

});</script>
</html>
