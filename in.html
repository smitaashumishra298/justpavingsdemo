<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Get Quote Form</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        /* =========================
           GET QUOTE BUTTON
        ========================= */

        .get-quote-btn {
            display: inline-block;
            padding: 14px 30px;
            border: none;
            border-radius: 5px;
            background: #c9a227;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .get-quote-btn:hover {
            background: #a98516;
        }

        /* =========================
           MODAL
        ========================= */

        .quote-modal {
            position: fixed;
            inset: 0;
            z-index: 99999;

            display: none;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .quote-modal.active {
            display: flex;
        }

        /* Overlay */

        .quote-overlay {
            position: absolute;
            inset: 0;

            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
        }

        /* Modal Box */

        .quote-box {
            position: relative;
            z-index: 2;

            width: 100%;
            max-width: 560px;

            max-height: 90vh;
            overflow-y: auto;

            padding: 35px;

            background: #fff;
            border-radius: 12px;

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);

            animation: popupAnimation 0.3s ease;
        }

        @keyframes popupAnimation {

            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }

        /* Close Button */

        .quote-close {
            position: absolute;
            top: 12px;
            right: 16px;

            width: 35px;
            height: 35px;

            border: none;
            background: transparent;

            color: #444;

            font-size: 30px;
            line-height: 30px;

            cursor: pointer;
        }

        .quote-close:hover {
            color: #c9a227;
        }

        /* Heading */

        .quote-box h2 {
            margin-bottom: 8px;

            color: #222;

            font-size: 30px;
        }

        .quote-subtitle {
            margin-bottom: 25px;

            color: #666;

            font-size: 14px;
            line-height: 1.5;
        }

        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            color: #333;

            font-size: 14px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;

            padding: 12px 14px;

            border: 1px solid #d5d5d5;
            border-radius: 6px;

            background: #fff;

            color: #222;

            font-family: inherit;
            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }

        .form-group textarea {
            min-height: 90px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #c9a227;

            box-shadow:
                0 0 0 3px rgba(201, 162, 39, 0.12);
        }

        /* Invalid */

        .form-group input.invalid,
        .form-group textarea.invalid {
            border-color: #d93025;
            background: #fff8f8;
        }

        /* Error */

        .error-message {
            display: block;

            min-height: 16px;

            margin-top: 5px;

            color: #d93025;

            font-size: 12px;
        }

        /* =========================
           SUBMIT BUTTON
        ========================= */

        .submit-quote-btn {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 6px;

            background: #c9a227;
            color: #fff;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;
        }

        .submit-quote-btn:hover {
            background: #a98516;
        }

        .submit-quote-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .submit-loader {
            display: none;
        }

        /* General Error */

        .form-general-error {
            margin-top: 14px;

            color: #d93025;

            text-align: center;

            font-size: 14px;
            line-height: 1.5;
        }

        /* =========================
           SUCCESS MESSAGE
        ========================= */

        .quote-success {
            display: none;

            padding: 30px 10px 15px;

            text-align: center;
        }

        .quote-success.active {
            display: block;
        }

        .success-icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #e8f5e9;
            color: #2e7d32;

            font-size: 40px;
            font-weight: bold;
        }

        .quote-success h3 {
            margin-bottom: 10px;

            color: #222;

            font-size: 28px;
        }

        .quote-success p {
            margin-bottom: 25px;

            color: #666;

            font-size: 15px;
            line-height: 1.6;
        }

        .success-close-btn {
            padding: 11px 28px;

            border: none;
            border-radius: 5px;

            background: #c9a227;
            color: #fff;

            font-size: 15px;

            cursor: pointer;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 576px) {

            .quote-modal {
                padding: 12px;
            }

            .quote-box {
                padding: 28px 20px;
                max-height: 92vh;
            }

            .quote-box h2 {
                font-size: 25px;
            }

        }
    </style>
</head>

<body>


    <!-- =========================
         GET QUOTE BUTTON
    ========================= -->

    <button
        type="button"
        class="get-quote-btn"
        id="openQuoteBtn">
        Get Quote
    </button>


    <!-- =========================
         POPUP MODAL
    ========================= -->

    <div
        class="quote-modal"
        id="quoteModal">

        <!-- Background Overlay -->
        <div
            class="quote-overlay"
            id="quoteOverlay">
        </div>


        <!-- Modal Box -->
        <div class="quote-box">

            <!-- Close -->
            <button
                type="button"
                class="quote-close"
                id="closeQuoteBtn">
                &times;
            </button>


            <!-- =====================
                 FORM SECTION
            ====================== -->

            <div id="quoteFormWrapper">

                <h2>Get a Quote</h2>

                <p class="quote-subtitle">
                    Fill in your details and we will contact you shortly.
                </p>


                <form
                    id="quoteForm"
                    novalidate>


                    <!-- FULL NAME -->

                    <div class="form-group">

                        <label for="fullName">
                            Full Name *
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            name="Full Name"
                            placeholder="Enter your full name"
                            autocomplete="name">

                        <small
                            class="error-message"
                            id="fullNameError">
                        </small>

                    </div>


                    <!-- COMPANY NAME -->

                    <div class="form-group">

                        <label for="companyName">
                            Company Name *
                        </label>

                        <input
                            type="text"
                            id="companyName"
                            name="Company Name"
                            placeholder="Enter company name"
                            autocomplete="organization">

                        <small
                            class="error-message"
                            id="companyNameError">
                        </small>

                    </div>


                    <!-- ADDRESS -->

                    <div class="form-group">

                        <label for="address">
                            Address *
                        </label>

                        <textarea
                            id="address"
                            name="Address"
                            rows="3"
                            placeholder="Enter your address"
                            autocomplete="street-address">
                        </textarea>

                        <small
                            class="error-message"
                            id="addressError">
                        </small>

                    </div>


                    <!-- PHONE -->

                    <div class="form-group">

                        <label for="phone">
                            Phone Number *
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="Phone Number"
                            placeholder="Enter 10 digit phone number"
                            maxlength="10"
                            inputmode="numeric"
                            autocomplete="tel">

                        <small
                            class="error-message"
                            id="phoneError">
                        </small>

                    </div>


                    <!-- MESSAGE -->

                    <div class="form-group">

                        <label for="message">
                            Message *
                        </label>

                        <textarea
                            id="message"
                            name="Message"
                            rows="4"
                            placeholder="Tell us what you need...">
                        </textarea>

                        <small
                            class="error-message"
                            id="messageError">
                        </small>

                    </div>


                    <!-- SUBMIT -->

                    <button
                        type="submit"
                        class="submit-quote-btn"
                        id="submitQuoteBtn">

                        <span id="submitText">
                            Send Enquiry
                        </span>

                        <span id="submitLoader">
                            Sending...
                        </span>

                    </button>


                    <!-- GENERAL ERROR -->

                    <div
                        class="form-general-error"
                        id="formGeneralError">
                    </div>

                </form>

            </div>


            <!-- =====================
                 SUCCESS SECTION
            ====================== -->

            <div
                class="quote-success"
                id="quoteSuccess">

                <div class="success-icon">
                    ✓
                </div>

                <h3>
                    Thank You!
                </h3>

                <p>
                    Your enquiry has been sent successfully.
                    We will contact you shortly.
                </p>

                <button
                    type="button"
                    class="success-close-btn"
                    id="successCloseBtn">

                    Close

                </button>

            </div>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        /* =====================================
           FORMSPREE ENDPOINT
        ===================================== */

        const FORMSPREE_ENDPOINT =
            "https://formspree.io/f/YOUR_FORM_ID";


        /* =====================================
           ELEMENTS
        ===================================== */

        const quoteModal =
            document.getElementById("quoteModal");

        const openQuoteBtn =
            document.getElementById("openQuoteBtn");

        const closeQuoteBtn =
            document.getElementById("closeQuoteBtn");

        const quoteOverlay =
            document.getElementById("quoteOverlay");

        const quoteForm =
            document.getElementById("quoteForm");

        const quoteFormWrapper =
            document.getElementById("quoteFormWrapper");

        const quoteSuccess =
            document.getElementById("quoteSuccess");

        const successCloseBtn =
            document.getElementById("successCloseBtn");

        const submitQuoteBtn =
            document.getElementById("submitQuoteBtn");

        const submitText =
            document.getElementById("submitText");

        const submitLoader =
            document.getElementById("submitLoader");

        const formGeneralError =
            document.getElementById("formGeneralError");


        /* FORM FIELDS */

        const fullName =
            document.getElementById("fullName");

        const companyName =
            document.getElementById("companyName");

        const address =
            document.getElementById("address");

        const phone =
            document.getElementById("phone");

        const message =
            document.getElementById("message");


        /* =====================================
           OPEN MODAL
        ===================================== */

        openQuoteBtn.addEventListener(
            "click",
            function () {

                quoteModal.classList.add("active");

                document.body.style.overflow = "hidden";

                setTimeout(function () {
                    fullName.focus();
                }, 200);

            }
        );


        /* =====================================
           CLOSE MODAL
        ===================================== */

        function closeQuoteModal() {

            quoteModal.classList.remove("active");

            document.body.style.overflow = "";

        }


        closeQuoteBtn.addEventListener(
            "click",
            closeQuoteModal
        );


        quoteOverlay.addEventListener(
            "click",
            closeQuoteModal
        );


        /* ESC KEY */

        document.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Escape") {

                    closeQuoteModal();

                }

            }
        );


        /* =====================================
           PHONE ONLY NUMBERS
        ===================================== */

        phone.addEventListener(
            "input",
            function () {

                this.value =
                    this.value
                    .replace(/\D/g, "")
                    .slice(0, 10);

            }
        );


        /* =====================================
           ERROR FUNCTIONS
        ===================================== */

        function setError(
            input,
            errorElement,
            errorMessage
        ) {

            input.classList.add("invalid");

            errorElement.textContent =
                errorMessage;

        }


        function clearError(
            input,
            errorElement
        ) {

            input.classList.remove("invalid");

            errorElement.textContent = "";

        }


        /* =====================================
           VALIDATE FORM
        ===================================== */

        function validateForm() {

            let isValid = true;

            formGeneralError.textContent = "";


            /* ===============================
               FULL NAME
            =============================== */

            const nameValue =
                fullName.value.trim();


            if (nameValue === "") {

                setError(
                    fullName,
                    document.getElementById(
                        "fullNameError"
                    ),
                    "Full Name is required."
                );

                isValid = false;

            }

            else if (
                !/^[A-Za-zÀ-ÿ\s.'-]{2,60}$/
                .test(nameValue)
            ) {

                setError(
                    fullName,
                    document.getElementById(
                        "fullNameError"
                    ),
                    "Please enter a valid full name."
                );

                isValid = false;

            }

            else {

                clearError(
                    fullName,
                    document.getElementById(
                        "fullNameError"
                    )
                );

            }


            /* ===============================
               COMPANY NAME
            =============================== */

            const companyValue =
                companyName.value.trim();


            if (companyValue === "") {

                setError(
                    companyName,
                    document.getElementById(
                        "companyNameError"
                    ),
                    "Company Name is required."
                );

                isValid = false;

            }

            else if (
                companyValue.length < 2 ||
                companyValue.length > 100
            ) {

                setError(
                    companyName,
                    document.getElementById(
                        "companyNameError"
                    ),
                    "Company Name must be between 2 and 100 characters."
                );

                isValid = false;

            }

            else {

                clearError(
                    companyName,
                    document.getElementById(
                        "companyNameError"
                    )
                );

            }


            /* ===============================
               ADDRESS
            =============================== */

            const addressValue =
                address.value.trim();


            if (addressValue === "") {

                setError(
                    address,
                    document.getElementById(
                        "addressError"
                    ),
                    "Address is required."
                );

                isValid = false;

            }

            else if (
                addressValue.length < 10
            ) {

                setError(
                    address,
                    document.getElementById(
                        "addressError"
                    ),
                    "Please enter a complete address."
                );

                isValid = false;

            }

            else if (
                addressValue.length > 300
            ) {

                setError(
                    address,
                    document.getElementById(
                        "addressError"
                    ),
                    "Address cannot exceed 300 characters."
                );

                isValid = false;

            }

            else {

                clearError(
                    address,
                    document.getElementById(
                        "addressError"
                    )
                );

            }


            /* ===============================
               PHONE
            =============================== */

            const phoneValue =
                phone.value.trim();


            if (phoneValue === "") {

                setError(
                    phone,
                    document.getElementById(
                        "phoneError"
                    ),
                    "Phone Number is required."
                );

                isValid = false;

            }

            else if (
                !/^[6-9][0-9]{9}$/
                .test(phoneValue)
            ) {

                setError(
                    phone,
                    document.getElementById(
                        "phoneError"
                    ),
                    "Enter a valid 10-digit Indian mobile number."
                );

                isValid = false;

            }

            else {

                clearError(
                    phone,
                    document.getElementById(
                        "phoneError"
                    )
                );

            }


            /* ===============================
               MESSAGE
            =============================== */

            const messageValue =
                message.value.trim();


            if (messageValue === "") {

                setError(
                    message,
                    document.getElementById(
                        "messageError"
                    ),
                    "Message is required."
                );

                isValid = false;

            }

            else if (
                messageValue.length < 10
            ) {

                setError(
                    message,
                    document.getElementById(
                        "messageError"
                    ),
                    "Message must contain at least 10 characters."
                );

                isValid = false;

            }

            else if (
                messageValue.length > 1000
            ) {

                setError(
                    message,
                    document.getElementById(
                        "messageError"
                    ),
                    "Message cannot exceed 1000 characters."
                );

                isValid = false;

            }

            else {

                clearError(
                    message,
                    document.getElementById(
                        "messageError"
                    )
                );

            }


            return isValid;

        }


        /* =====================================
           SUBMIT FORM
        ===================================== */

        quoteForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                /* VALIDATION */

                if (!validateForm()) {

                    return;

                }


                /* LOADING */

                submitQuoteBtn.disabled = true;

                submitText.style.display =
                    "none";

                submitLoader.style.display =
                    "inline";


                try {

                    const formData =
                        new FormData(quoteForm);


                    const response =
                        await fetch(
                            FORMSPREE_ENDPOINT,
                            {
                                method: "POST",

                                body: formData,

                                headers: {
                                    "Accept":
                                        "application/json"
                                }
                            }
                        );


                    /* SUCCESS */

                    if (response.ok) {

                        quoteFormWrapper.style.display =
                            "none";

                        quoteSuccess.classList.add(
                            "active"
                        );

                        quoteForm.reset();

                    }


                    /* ERROR */

                    else {

                        formGeneralError.textContent =
                            "Unable to send your enquiry. Please try again.";

                    }

                }


                catch (error) {

                    formGeneralError.textContent =
                        "Something went wrong. Please check your internet connection.";

                }


                /* RESET BUTTON */

                submitQuoteBtn.disabled = false;

                submitText.style.display =
                    "inline";

                submitLoader.style.display =
                    "none";

            }
        );


        /* =====================================
           SUCCESS CLOSE
        ===================================== */

        successCloseBtn.addEventListener(
            "click",
            function () {

                quoteSuccess.classList.remove(
                    "active"
                );

                quoteFormWrapper.style.display =
                    "block";

                closeQuoteModal();

            }
        );

    </script>

</body>
</html>
