<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JustPaving - Get a Quote</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        :root {
            --gold: #C9A227;
            --dark: #2F2F2F;
            --line: #e5e5e5;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .get-quote-btn {
            background: var(--gold);
            color: #fff;
            border: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: .3s;
        }

        .get-quote-btn:hover {
            background: #a8871c;
            transform: translateY(-2px);
        }

        .quote-modal .modal-content {
            border: 0;
            border-radius: 20px;
            overflow: hidden;
        }

        .quote-modal .modal-header {
            background: var(--dark);
            color: #fff;
            padding: 22px 25px;
            border: 0;
        }

        .quote-modal .modal-title {
            font-weight: 600;
        }

        .quote-modal .btn-close {
            filter: brightness(0) invert(1);
        }

        .quote-modal .modal-body {
            padding: 28px;
        }

        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 7px;
        }

        .form-control {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 12px 14px;
            box-shadow: none !important;
        }

        .form-control:focus {
            border-color: var(--gold);
        }

        .form-control.is-invalid {
            border-color: #dc3545;
        }

        .field-error {
            display: none;
            color: #dc3545;
            font-size: 13px;
            margin-top: 5px;
        }

        .field-error.show {
            display: block;
        }

        .quote-message {
            display: none;
            padding: 13px 15px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .quote-message.show {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .quote-message.success {
            background: #e9f7ef;
            color: #18733c;
            border: 1px solid #b9e4c9;
        }

        .quote-message.error {
            background: #fff0f0;
            color: #b42318;
            border: 1px solid #f2c2c2;
        }

        .submit-btn {
            width: 100%;
            background: var(--gold);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
        }

        .submit-btn:hover {
            background: #a8871c;
        }

        .submit-btn:disabled {
            opacity: .7;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

<!-- =========================================================
     GET QUOTE BUTTON
========================================================= -->

<div class="container py-5 text-center">

    <button
        type="button"
        class="get-quote-btn"
        data-bs-toggle="modal"
        data-bs-target="#quoteModal"
    >
        <i class="fa-solid fa-file-signature"></i>
        Get Quote
    </button>

</div>


<!-- =========================================================
     GET QUOTE MODAL
========================================================= -->

<div
    class="modal fade quote-modal"
    id="quoteModal"
    tabindex="-1"
    aria-hidden="true"
>

    <div class="modal-dialog modal-dialog-centered modal-lg">

        <div class="modal-content">

            <!-- HEADER -->

            <div class="modal-header">

                <h5 class="modal-title">
                    <i class="fa-solid fa-file-signature me-2"></i>
                    Get a Quote
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>

            </div>


            <!-- BODY -->

            <div class="modal-body">

                <!-- MESSAGE -->

                <div
                    id="quoteMessage"
                    class="quote-message"
                ></div>


                <!-- FORM -->

                <form
                    id="quoteForm"
                    novalidate
                >

                    <!-- FULL NAME -->

                    <div class="mb-3">

                        <label
                            for="fullName"
                            class="form-label"
                        >
                            Full Name *
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            class="form-control"
                            placeholder="Enter your full name"
                        >

                        <div class="field-error">
                            Please enter your full name.
                        </div>

                    </div>


                    <!-- COMPANY NAME -->

                    <div class="mb-3">

                        <label
                            for="companyName"
                            class="form-label"
                        >
                            Company Name *
                        </label>

                        <input
                            type="text"
                            id="companyName"
                            name="companyName"
                            class="form-control"
                            placeholder="Enter company name"
                        >

                        <div class="field-error">
                            Please enter your company name.
                        </div>

                    </div>


                    <!-- ADDRESS -->

                    <div class="mb-3">

                        <label
                            for="address"
                            class="form-label"
                        >
                            Address *
                        </label>

                        <textarea
                            id="address"
                            name="address"
                            class="form-control"
                            rows="3"
                            placeholder="Enter your address"
                        ></textarea>

                        <div class="field-error">
                            Please enter your address.
                        </div>

                    </div>


                    <!-- PHONE -->

                    <div class="mb-3">

                        <label
                            for="phone"
                            class="form-label"
                        >
                            Phone Number *
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            class="form-control"
                            placeholder="Enter your phone number"
                        >

                        <div class="field-error">
                            Please enter a valid phone number.
                        </div>

                    </div>


                    <!-- MESSAGE -->

                    <div class="mb-4">

                        <label
                            for="yourMessage"
                            class="form-label"
                        >
                            Your Message *
                        </label>

                        <textarea
                            id="yourMessage"
                            name="yourMessage"
                            class="form-control"
                            rows="4"
                            placeholder="Tell us what you need..."
                        ></textarea>

                        <div class="field-error">
                            Please enter your message.
                        </div>

                    </div>


                    <!-- SUBMIT -->

                    <button
                        type="submit"
                        id="quoteSubmit"
                        class="submit-btn"
                    >

                        <span id="submitText">
                            <i class="fa-solid fa-paper-plane me-2"></i>
                            Send Quote Request
                        </span>

                        <span
                            id="submitLoading"
                            style="display:none;"
                        >
                            <span
                                class="spinner-border spinner-border-sm me-2"
                            ></span>
                            Sending...
                        </span>

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    const form = document.getElementById("quoteForm");

    const messageBox =
        document.getElementById("quoteMessage");

    const submitButton =
        document.getElementById("quoteSubmit");

    const submitText =
        document.getElementById("submitText");

    const submitLoading =
        document.getElementById("submitLoading");


    /*
    ============================================================
    IMPORTANT

    YAHAN APNA CLOUDFLARE WORKER URL DENA HAI
    ============================================================
    */

    const WORKER_URL =
        "https://YOUR-WORKER-NAME.YOUR-SUBDOMAIN.workers.dev";


    /*
    ============================================================
    INPUTS
    ============================================================
    */

    const fullName =
        document.getElementById("fullName");

    const companyName =
        document.getElementById("companyName");

    const address =
        document.getElementById("address");

    const phone =
        document.getElementById("phone");

    const yourMessage =
        document.getElementById("yourMessage");


    /*
    ============================================================
    SHOW ERROR
    ============================================================
    */

    function showError(input, message) {

        input.classList.add("is-invalid");

        const error =
            input.parentElement.querySelector(".field-error");

        if (error) {

            error.textContent = message;

            error.classList.add("show");

        }

    }


    /*
    ============================================================
    CLEAR ERROR
    ============================================================
    */

    function clearError(input) {

        input.classList.remove("is-invalid");

        const error =
            input.parentElement.querySelector(".field-error");

        if (error) {

            error.classList.remove("show");

        }

    }


    /*
    ============================================================
    VALIDATE NORMAL FIELD
    ============================================================
    */

    function validateField(input, message) {

        if (input.value.trim() === "") {

            showError(input, message);

            return false;

        }

        clearError(input);

        return true;

    }


    /*
    ============================================================
    PHONE VALIDATION
    ============================================================
    */

    function validatePhone() {

        const value =
            phone.value.trim();

        const pattern =
            /^[0-9+\-\s()]{7,15}$/;

        if (value === "") {

            showError(
                phone,
                "Please enter your phone number."
            );

            return false;

        }

        if (!pattern.test(value)) {

            showError(
                phone,
                "Please enter a valid phone number."
            );

            return false;

        }

        clearError(phone);

        return true;

    }


    /*
    ============================================================
    CLEAR MESSAGE
    ============================================================
    */

    function clearMessage() {

        messageBox.className =
            "quote-message";

        messageBox.innerHTML = "";

    }


    /*
    ============================================================
    FORM SUBMIT
    ============================================================
    */

    form.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            clearMessage();


            /*
            VALIDATION
            */

            const validName =
                validateField(
                    fullName,
                    "Please enter your full name."
                );

            const validCompany =
                validateField(
                    companyName,
                    "Please enter your company name."
                );

            const validAddress =
                validateField(
                    address,
                    "Please enter your address."
                );

            const validPhone =
                validatePhone();

            const validMessage =
                validateField(
                    yourMessage,
                    "Please enter your message."
                );


            if (
                !validName ||
                !validCompany ||
                !validAddress ||
                !validPhone ||
                !validMessage
            ) {

                return;

            }


            /*
            LOADING
            */

            submitButton.disabled = true;

            submitText.style.display = "none";

            submitLoading.style.display = "inline";


            /*
            FORM DATA
            */

            const formData = {

                fullName:
                    fullName.value.trim(),

                companyName:
                    companyName.value.trim(),

                address:
                    address.value.trim(),

                phone:
                    phone.value.trim(),

                message:
                    yourMessage.value.trim()

            };


            /*
            ====================================================
            SEND TO CLOUDFLARE WORKER
            ====================================================
            */

            try {

                const response =
                    await fetch(
                        WORKER_URL,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(formData)
                        }
                    );


                const result =
                    await response.json();


                /*
                SUCCESS
                */

                if (response.ok && result.success) {

                    messageBox.className =
                        "quote-message success show";

                    messageBox.innerHTML =
                        '<i class="fa-solid fa-circle-check"></i>' +
                        '<span>' +
                        (
                            result.message ||
                            "Thank you! Your quote request has been sent successfully."
                        ) +
                        '</span>';


                    form.reset();


                } else {

                    throw new Error(
                        result.message ||
                        "Unable to send request."
                    );

                }


            } catch (error) {

                console.error(error);


                messageBox.className =
                    "quote-message error show";

                messageBox.innerHTML =
                    '<i class="fa-solid fa-circle-exclamation"></i>' +
                    '<span>' +
                    'Unable to send your request. Please try again later.' +
                    '</span>';

            }


            /*
            RESET BUTTON
            */

            submitButton.disabled = false;

            submitText.style.display = "inline";

            submitLoading.style.display = "none";

        }
    );


    /*
    ============================================================
    LIVE VALIDATION
    ============================================================
    */

    [
        fullName,
        companyName,
        address,
        yourMessage
    ].forEach(function (input) {

        input.addEventListener(
            "input",
            function () {

                if (
                    this.value.trim() !== ""
                ) {

                    clearError(this);

                }

            }
        );

    });


    /*
    PHONE ONLY NUMBERS / SYMBOLS
    */

    phone.addEventListener(
        "input",
        function () {

            this.value =
                this.value.replace(
                    /[^0-9+\-\s()]/g,
                    ""
                );

            if (
                this.value.trim() !== ""
            ) {

                clearError(this);

            }

        }
    );


    /*
    ============================================================
    MODAL OPEN
    ============================================================
    */

    const quoteModal =
        document.getElementById("quoteModal");

    if (quoteModal) {

        quoteModal.addEventListener(
            "show.bs.modal",
            function () {

                clearMessage();

            }
        );

    }

});

</script>

</body>
</html>
